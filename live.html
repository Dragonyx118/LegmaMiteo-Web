<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LegmaMiteo - Dati Live</title>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.344.0/dist/umd/lucide.min.js"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --primary: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); }
        header { background: var(--bg-card); border-bottom: 1px solid var(--border); padding: 1rem 2rem; }
        nav { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: bold; color: var(--primary); display: flex; align-items: center; gap: 0.5rem; }
        .nav-links { display: flex; gap: 1.5rem; list-style: none; }
        .nav-links a { color: var(--text-main); text-decoration: none; font-weight: 500; }
        .nav-links a:hover, .nav-links a.active { color: var(--primary); }
        
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 2rem; }
        .search-box { display: flex; gap: 1rem; max-width: 500px; margin-bottom: 3rem; }
        .search-box input { flex: 1; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid var(--border); background: var(--bg-card); color: white; }
        .search-box button { background: var(--primary); color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 0.5rem; cursor: pointer; font-weight: 600; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.5rem; }
        .dashboard-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 0.75rem; padding: 1.5rem; display: flex; align-items: center; gap: 1rem; }
        .icon-wrapper { background: rgba(37, 99, 235, 0.1); color: var(--primary); padding: 1rem; border-radius: 0.5rem; }
        .data-value { font-size: 1.8rem; font-weight: bold; margin-top: 0.25rem; }
        .data-label { color: var(--text-muted); font-size: 0.85rem; }

        footer { background: #020617; border-top: 1px solid var(--border); padding: 2rem; text-align: center; margin-top: 6rem; }
        .github-btn { display: inline-flex; align-items: center; gap: 0.5rem; background: #24292e; color: white; padding: 0.5rem 1rem; border-radius: 0.375rem; text-decoration: none; font-size: 0.9rem; margin-top: 1rem; }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo"><i data-lucide="cloud-lightning"></i> LegmaMiteo</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="live.html" class="active">Dati Live</a></li>
                <li><a href="api.html">API Docs</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h2>Ricerca Stazione</h2>
        <div class="search-box">
            <input type="text" placeholder="Inserisci ID Stazione (es. LOM-001)" value="LOM-001">
            <button>Cerca</button>
        </div>

        <div class="grid">
            <div class="dashboard-card">
                <div class="icon-wrapper"><i data-lucide="thermometer"></i></div>
                <div>
                    <p class="data-label">Temperatura</p>
                    <p class="data-value">23.4 °C</p>
                </div>
            </div>
            <div class="dashboard-card">
                <div class="icon-wrapper"><i data-lucide="droplets"></i></div>
                <div>
                    <p class="data-label">Umidità Relativa</p>
                    <p class="data-value">56 %</p>
                </div>
            </div>
            <div class="dashboard-card">
                <div class="icon-wrapper"><i data-lucide="gauge"></i></div>
                <div>
                    <p class="data-label">Pressione</p>
                    <p class="data-value">1012 hPa</p>
                </div>
            </div>
            <div class="dashboard-card">
                <div class="icon-wrapper"><i data-lucide="wind"></i></div>
                <div>
                    <p class="data-label">Velocità Vento</p>
                    <p class="data-value">12.5 km/h</p>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 LegmaMiteo Project. Tutti i diritti riservati.</p>
        <a href="https://github.com/Dragonyx118/LegmaMiteo-Web" class="github-btn" target="_blank">
            <svg height="20" width="20" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
            Vedi la Repository su GitHub
        </a>
    </footer>

    <script>lucide.createIcons();</script>
</body>
</html>
